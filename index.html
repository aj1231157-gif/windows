<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS Hub — Downloads</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --text: #eaeaea;
      --muted: #7a7a82;
      --accent: #b0b0b8;
      --card: rgba(14, 14, 18, 0.7);
      --border: rgba(255, 255, 255, 0.05);
      --border-hover: rgba(255, 255, 255, 0.12);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ===== FUNDO COM ONDAS ===== */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #0a0a0c;
      overflow: hidden;
    }
    .wave-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .wave-layer svg { width: 100%; height: 100%; display: block; }

    /* ===== SPLASH ===== */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0c;
      transition: opacity 0.7s ease, visibility 0.7s;
    }
    .splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    .splash-logo {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 200;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.9s 0.2s forwards;
    }
    .splash-sub {
      margin-top: 0.7rem;
      font-size: 0.7rem;
      letter-spacing: 0.5em;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 0.8s 0.7s forwards;
    }
    .splash-line {
      width: 0;
      height: 1px;
      margin-top: 1.6rem;
      background: var(--accent);
      opacity: 0.2;
      animation: expandLine 1s 1.2s forwards;
    }

    /* ===== MAIN ===== */
    .main {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      transition: opacity 0.8s ease 0.2s;
    }
    .main.show { opacity: 1; }

    .header {
      text-align: center;
      margin-bottom: 2.6rem;
      opacity: 0;
      transform: translateY(18px);
    }
    .main.show .header { animation: fadeUp 0.6s 0.1s forwards; }

    .header h1 {
      font-size: clamp(1.3rem, 3.5vw, 2rem);
      font-weight: 200;
      letter-spacing: 0.18em;
      margin-bottom: 0.4rem;
    }
    .header h1 span { color: var(--accent); font-weight: 300; }
    .header p {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    /* ===== CARDS ===== */
    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 800px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.8rem 1.2rem;
      text-align: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px);
      opacity: 0;
      transform: translateY(28px) scale(0.96);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.3s,
                  box-shadow 0.35s;
    }

    .main.show .card { animation: cardIn 0.65s forwards; }
    .main.show .card:nth-child(1) { animation-delay: 0.25s; }
    .main.show .card:nth-child(2) { animation-delay: 0.35s; }
    .main.show .card:nth-child(3) { animation-delay: 0.45s; }
    .main.show .card:nth-child(4) { animation-delay: 0.55s; }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.03), transparent 70%);
      opacity: 0;
      transition: opacity 0.35s;
    }
    .card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--border-hover);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .card:hover::after { opacity: 1; }
    .card:active { transform: translateY(-3px) scale(1.005); }

    .card-icon {
      width: 2.5rem;
      height: 2.5rem;
      margin: 0 auto 1rem;
      display: block;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      transition: filter 0.3s;
    }
    .card:hover .card-icon { transform: scale(1.08) translateY(-3px); }

    .card-icon.mono svg { fill: #eaeaea; }
    .card:hover .card-icon.mono svg { fill: #ffffff; }

    .card-icon.color svg { filter: saturate(0.6) brightness(0.85); }
    .card:hover .card-icon.color svg { filter: saturate(1) brightness(1); }

    .card h2 {
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      margin-bottom: 0.3rem;
      transition: letter-spacing 0.3s;
    }
    .card:hover h2 { letter-spacing: 0.12em; }

    .card p {
      font-size: 0.7rem;
      color: var(--muted);
      transition: color 0.3s;
      letter-spacing: 0.02em;
    }
    .card:hover p { color: #9a9aa2; }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(6, 6, 8, 0.88);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
      padding: 1.5rem;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }

    .modal {
      background: #0e0e12;
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      max-height: 82vh;
      overflow-y: auto;
      padding: 1.8rem;
      transform: scale(0.92) translateY(16px);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
    }
    .modal-overlay.open .modal { transform: scale(1) translateY(0); opacity: 1; }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.4rem;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.06em;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
    }
    .modal-close:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--border-hover);
      color: var(--text);
      transform: rotate(90deg);
    }

    .download-list { display: flex; flex-direction: column; gap: 0.6rem; }

    .download-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1rem;
      background: rgba(8, 8, 12, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      opacity: 0;
      transform: translateX(-10px);
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: border-color 0.25s, background 0.25s, transform 0.2s;
    }
    .modal-overlay.open .download-item { animation: itemIn 0.4s forwards; }
    .modal-overlay.open .download-item:nth-child(1)  { animation-delay: 0.06s; }
    .modal-overlay.open .download-item:nth-child(2)  { animation-delay: 0.11s; }
    .modal-overlay.open .download-item:nth-child(3)  { animation-delay: 0.16s; }
    .modal-overlay.open .download-item:nth-child(4)  { animation-delay: 0.21s; }
    .modal-overlay.open .download-item:nth-child(5)  { animation-delay: 0.26s; }
    .modal-overlay.open .download-item:nth-child(6)  { animation-delay: 0.31s; }
    .modal-overlay.open .download-item:nth-child(7)  { animation-delay: 0.36s; }
    .modal-overlay.open .download-item:nth-child(8)  { animation-delay: 0.41s; }
    .modal-overlay.open .download-item:nth-child(9)  { animation-delay: 0.46s; }
    .modal-overlay.open .download-item:nth-child(10) { animation-delay: 0.51s; }

    .download-item:hover {
      border-color: var(--border-hover);
      background: rgba(20, 20, 28, 0.9);
      transform: translateX(3px);
    }

    .download-info { display: flex; flex-direction: column; gap: 0.15rem; }
    .download-info strong {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.02em;
    }
    .download-info span {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .download-badge {
      font-size: 0.6rem;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      letter-spacing: 0.06em;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.25s;
    }
    .download-item:hover .download-badge {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border-color: rgba(255,255,255,0.15);
    }

    .modal-note {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      opacity: 0;
      animation: fadeUp 0.4s 0.6s forwards;
    }

    .loading, .error {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .error { color: #d97a7a; }

    /* ===== ANIMAÇÕES ===== */
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes expandLine { to { width: 80px; } }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes itemIn { to { opacity: 1; transform: translateX(0); } }

    /* ===== RESPONSIVO ===== */
    @media (max-width: 600px) {
      .options { grid-template-columns: 1fr 1fr; gap: 0.8rem; }
      .card { padding: 1.3rem 0.9rem; }
      .card-icon { width: 2rem; height: 2rem; }
      .header { margin-bottom: 1.8rem; }
      .header h1 { letter-spacing: 0.12em; }
    }
    @media (max-width: 400px) {
      .options { grid-template-columns: 1fr; }
      .card { padding: 1.1rem 1rem; }
    }
  </style>
</head>

  <script>
    /* ============================================================
       ⚙️  CONFIGURAÇÃO — EDITE APENAS ESTA LINHA
       ============================================================
       Cole aqui o link RAW do seu manifest.json no GitHub.
       Formato:
       https://raw.githubusercontent.com/SEU_USUARIO/SEU_REPO/main/manifest.json
    */
    const MANIFEST_URL = "https://raw.githubusercontent.com/aj1231157-gif/windows/main/manifest.json";
    /* ============================================================ */

    // Cache dos dados carregados
    let downloads = {};
    let manifestCarregado = false;

    // ---- SPLASH ----
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('splash').classList.add('hide');
        document.getElementById('main').classList.add('show');
      }, 2400);
    });

    // ---- CARREGA O MANIFEST ----
    async function carregarManifest() {
      try {
        const res = await fetch(MANIFEST_URL, { cache: 'no-cache' });
        if (!res.ok) throw new Error("HTTP " + res.status);
        downloads = await res.json();
        manifestCarregado = true;
        console.log("✅ Manifest carregado:", downloads);
      } catch (err) {
        console.error("❌ Erro ao carregar manifest:", err);
        manifestCarregado = false;
      }
    }

    // Começa a carregar assim que a página abre
    carregarManifest();

    // ---- MODAL ----
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const downloadList = document.getElementById('download-list');
    const closeBtn = document.getElementById('modal-close');

    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', async () => {
        const os = card.dataset.os;
        modalTitle.textContent = "Carregando...";
        downloadList.innerHTML = `<div class="loading">Buscando lista de downloads...</div>`;
        modal.classList.add('open');

        // Se ainda não carregou, tenta de novo na hora
        if (!manifestCarregado) {
          await carregarManifest();
        }

        const data = downloads[os];
        if (!data) {
          downloadList.innerHTML = `<div class="error">Nenhum item disponível para este sistema.</div>`;
          modalTitle.textContent = "Indisponível";
          return;
        }

        modalTitle.textContent = data.title;

        // Aguarda um instante só pra manter a animação suave
        setTimeout(() => {
          downloadList.innerHTML = data.items.map(item => {
            const url = item.url || "#";
            return `
              <a class="download-item" href="${url}" target="_blank" rel="noopener">
                <div class="download-info">
                  <strong>${item.name}</strong>
                  <span>${item.size || ""}</span>
                </div>
                <span class="download-badge">${item.type || "ARQ"}</span>
              </a>
            `;
          }).join('');
        }, 120);
      });
    });

    function closeModal() { modal.classList.remove('open'); }
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
