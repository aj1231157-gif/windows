<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY'S NIGHTSHIFT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; font-family:'Courier New',monospace; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  #game { position:relative; width:100vw; height:100vh; }
  canvas { display:block; }
  #vignette {
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at 50% 50%, transparent 22%, rgba(0,0,0,0.72) 76%, rgba(0,0,0,0.98) 100%);
  }

  #hud { position:absolute; inset:0; pointer-events:none; z-index:10; }
  .hud-corner {
    position:absolute;
    background:linear-gradient(180deg, rgba(20,4,4,0.85), rgba(10,2,2,0.92));
    border:1px solid #590503;
    padding:14px 20px; letter-spacing:2px;
    box-shadow: 0 0 20px rgba(89,5,3,0.4) inset;
  }
  #hud-left { top:20px; left:20px; min-width:230px; }
  #hud-right { top:20px; right:20px; text-align:right; min-width:180px; }
  .hud-label { font-size:.68rem; color:#8a3030; letter-spacing:3px; margin-bottom:2px; }
  .power-value { font-size:2rem; color:#8f302d; text-shadow:0 0 6px #3a0302; }
  .power-bar-bg { margin-top:6px; width:100%; height:6px; background:#1a0505; border:1px solid #590503; overflow:hidden; }
  .power-bar-fill { height:100%; background:linear-gradient(90deg,#590503,#7a2e2c); transition:width .3s; width:100%; }
  .sys-row { font-size:.72rem; color:#8a5555; letter-spacing:2px; margin-top:6px; display:flex; justify-content:space-between; }
  .sys-row span:last-child { color:#9a5a58; font-weight:bold; }
  .usage-bar { margin-top:4px; letter-spacing:4px; color:#7a2e2c; font-size:1rem; }
  .usage-bar .on { color:#8f302d; }
  .usage-bar .off { color:#3a1010; }
  .time-value { font-size:2rem; color:#8f302d; text-shadow:0 0 6px #3a0302; letter-spacing:3px; }
  .night-value { font-size:.72rem; color:#8a4442; letter-spacing:4px; margin-top:4px; }

  #controls { position:absolute; inset:0; z-index:20; pointer-events:none; }
  .ctrl-btn {
    position:absolute; pointer-events:auto;
    background:linear-gradient(180deg, rgba(25,6,6,0.95), rgba(12,3,3,0.97));
    border:1px solid #590503; border-radius:2px;
    color:#8a5555; font-weight:bold; font-size:.76rem;
    letter-spacing:3px; padding:12px 20px 12px 42px;
    cursor:pointer; text-align:left; min-width:230px;
    box-shadow: inset 0 0 20px #000, 0 0 12px rgba(89,5,3,0.5);
    transition: border-color .06s, color .06s;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .ctrl-btn:hover { border-color:#8a1010; color:#e89090; }
  .ctrl-btn::before {
    content:''; position:absolute; left:14px; top:50%;
    width:11px; height:11px; margin-top:-5.5px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#8f8,#0a3 60%,#030);
    box-shadow:0 0 8px #0d0; transition: none;
  }
  .ctrl-btn.active {
    background:linear-gradient(180deg, rgba(60,10,10,0.96), rgba(30,4,4,0.96));
    border-color:#c02020; color:#fff;
    box-shadow: inset 0 0 22px rgba(89,5,3,0.85), 0 0 24px rgba(200,40,40,0.5);
  }
  .ctrl-btn.active::before {
    background:radial-gradient(circle at 35% 30%,#fbb,#e11 60%,#400);
    box-shadow:0 0 14px #f00;
  }
  .ctrl-btn.light.active {
    border-color:#fb0;
    background:linear-gradient(180deg, rgba(80,60,10,0.96), rgba(30,20,4,0.96));
  }
  .ctrl-btn.light.active::before {
    background:radial-gradient(circle at 35% 30%,#fff,#fc0 55%,#640);
    box-shadow:0 0 14px #fb0;
  }
  .ctrl-btn small { display:block; font-size:.62rem; color:#8a4040; letter-spacing:2px; margin-top:2px; }
  #btn-left-door { bottom:120px; left:24px; }
  #btn-left-light { bottom:60px; left:24px; }
  #btn-right-door { bottom:120px; right:24px; }
  #btn-right-light { bottom:60px; right:24px; }
  #btn-monitor { bottom:60px; left:50%; transform:translateX(-50%); min-width:250px; }

  #menu {
    position:absolute; inset:0; z-index:100;
    background:radial-gradient(ellipse at 50% 60%, rgba(89,5,3,0.55), rgba(0,0,0,0.98) 68%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#c04040;
  }
  #menu h1 { font-size:3.4rem; letter-spacing:12px; color:#d33; text-shadow:0 0 20px #f00, 0 0 40px #800; animation:flick 4s infinite; }
  @keyframes flick { 0%,100%{opacity:1} 91%{opacity:1} 92%{opacity:.3} 93%{opacity:.9} 95%{opacity:1} }
  #menu .sub { margin-top:14px; color:#a44; letter-spacing:5px; font-size:.85rem; font-style:italic; }
  .menu-btn {
    margin-top:44px;
    background:linear-gradient(180deg,#1a0505,#0a0202);
    border:2px solid #590503; color:#c44;
    padding:14px 42px; font-size:1rem; letter-spacing:5px;
    cursor:pointer; transition:all .2s; min-width:300px;
  }
  .menu-btn:hover { background:linear-gradient(180deg,#350505,#1a0303); border-color:#f33; color:#faa; box-shadow:0 0 24px #900, 0 0 40px #400 inset; }
  .hidden { display:none !important; }
  #loading {
    position:absolute; inset:0; z-index:300; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#c04040; font-size:1rem; letter-spacing:5px; text-align:center; padding:20px;
  }
  #loading .err { color:#f66; font-size:.8rem; margin-top:20px; max-width:600px; line-height:1.6; letter-spacing:1px; text-transform:none; }
</style>
</head>
<body>
<div id="game">
  <div id="loading">
    <div>CONECTANDO AO SISTEMA DE SEGURANÇA...</div>
    <div class="err hidden" id="loading-err"></div>
  </div>
  <div id="vignette" class="hidden"></div>

  <div id="hud" class="hidden">
    <div id="hud-left" class="hud-corner">
      <div class="hud-label">ENERGIA</div>
      <div class="power-value" id="power-display">100%</div>
      <div class="power-bar-bg"><div class="power-bar-fill" id="power-bar"></div></div>
      <div class="sys-row"><span>◉ CÂMERAS</span><span id="sys-cam">0.1</span></div>
      <div class="sys-row"><span>▣ PORTAS</span><span id="sys-doors">0.0</span></div>
      <div class="sys-row"><span>☀ LUZES</span><span id="sys-lights">0.0</span></div>
      <div class="hud-label" style="margin-top:10px">USO TOTAL</div>
      <div class="usage-bar" id="usage-display"></div>
    </div>
    <div id="hud-right" class="hud-corner">
      <div class="time-value" id="time-display">12:00 AM</div>
      <div class="night-value">NOITE 1</div>
    </div>
  </div>

  <div id="controls" class="hidden">
    <button class="ctrl-btn" id="btn-left-door">PORTA ESQ.<small>ABERTA</small></button>
    <button class="ctrl-btn light" id="btn-left-light">LUZ ESQ.<small>DESLIGADA</small></button>
    <button class="ctrl-btn" id="btn-right-door">PORTA DIR.<small>ABERTA</small></button>
    <button class="ctrl-btn light" id="btn-right-light">LUZ DIR.<small>DESLIGADA</small></button>
    <button class="ctrl-btn" id="btn-monitor">MONITOR DE CÂMERAS<small>ESPAÇO</small></button>
  </div>

  <div id="menu">
    <h1>FREDDY'S NIGHTSHIFT</h1>
    <p class="sub">"Algumas noites são melhores esquecidas."</p>
    <button class="menu-btn" id="btn-start">INICIAR TURNO</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if (typeof THREE === 'undefined') {
  document.getElementById('loading').innerHTML =
    '<div style="color:#f66;font-size:1.4rem;">ERRO</div><div class="err">Não foi possível carregar Three.js.</div>';
}
</script>
<script>
if (typeof THREE !== 'undefined') {
'use strict';

/* ================================================================
   LAYOUT CORRIGIDO:
   - Corredores ALINHADOS com as portas em Z (principal bug corrigido)
   - Janelas PEQUENAS (0.6 × 0.8 m) próximas das portas
   - Monitor muito próximo da câmera
   - Sala menor e mais claustrofóbica
   ================================================================ */

var S = {
  ROOM_W: 4.5, ROOM_D: 5.0, ROOM_H: 2.7, WALL_T: 0.14,
  DOOR_W: 1.0, DOOR_H: 2.15,
  WIN_W: 0.4, WIN_H: 0.55, WIN_Y: 1.4,
  DESK_W: 2.8, DESK_D: 0.7, DESK_H: 0.75, DESK_T: 0.05,
  EYE_Y: 1.15, EYE_Z: 1.5,
  // Corredor: alinhado em Z com as portas
  COR_Z1: 3.0,    // ponta da FRENTE do corredor (passa da sala, atrás do jogador)
  COR_H: 2.7,
  COR_LEN: 6.6,  // vai de z=-3.6 (um pouco atrás do fundo da sala) até a frente
  COR_W: 2.8      // largura (em X) a partir da parede lateral da sala
};

var GEO = {
  backZ: -S.ROOM_D/2,   // -2.5
  frontZ: S.ROOM_D/2,   //  2.5
  leftX: -S.ROOM_W/2,   // -2.25
  rightX: S.ROOM_W/2,   //  2.25
  // Porta (na parede lateral)
  doorZ0: -1.8,
  doorZ1: -0.8,
  // Janela pequena (logo à frente da porta)
  winZ0: -0.3,
  winZ1: 0.1
};

/* ================================================================
   GAME STATE
   ================================================================ */
var Game = {
  running: false,
  hour: 0, hourProgress: 0, HOUR_DURATION: 45,
  power: 100, usage: 1,
  doors: { left: false, right: false },
  lights: { left: false, right: false },
  monitorOpen: false,
  ambientTime: 0, lastFrame: 0,
  doorAnim: { left: 0, right: 0 },
  doorTarget: { left: 0, right: 0 },
  flickerNext: 3, flickerActive: null, flickerTime: 0, flickerBoost: 0, flickerPeak: 0
};

/* ================================================================
   THREE
   ================================================================ */
var renderer, scene, camera, objs = {};

function makeMat(color, rough, metal, opts) {
  opts = opts || {};
  var m = new THREE.MeshStandardMaterial({ color: color, roughness: rough, metalness: metal });
  if (opts.emissive !== undefined) m.emissive = new THREE.Color(opts.emissive);
  if (opts.emissiveIntensity !== undefined) m.emissiveIntensity = opts.emissiveIntensity;
  if (opts.side !== undefined) m.side = opts.side;
  if (opts.transparent) { m.transparent = true; m.opacity = (opts.opacity !== undefined) ? opts.opacity : 1; }
  if (opts.map) m.map = opts.map;
  return m;
}

/* ================================================================
   TEXTURAS PROCEDURAIS
   ================================================================ */
function makeTexture(size, drawFn, repX, repY) {
  var c = document.createElement('canvas');
  c.width = size; c.height = size;
  drawFn(c.getContext('2d'), size, size);
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX || 1, repY || 1);
  return t;
}

function addNoise(ctx, w, h, count, maxAlpha, maxR) {
  for (var i = 0; i < count; i++) {
    ctx.fillStyle = 'rgba(0,0,0,' + (Math.random() * maxAlpha) + ')';
    ctx.beginPath();
    ctx.arc(Math.random()*w, Math.random()*h, 1 + Math.random()*maxR, 0, Math.PI*2);
    ctx.fill();
  }
}

function rnd(a, b) { return a + Math.random() * (b - a); }
function blotch(ctx, x, y, r, rgb, a) {
  var g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r*2, r*2);
}
function scratches(ctx, w, h, n, rgb, maxA, len) {
  ctx.lineWidth = 1;
  for (var i = 0; i < n; i++) {
    var x = rnd(0, w), y = rnd(0, h), a = rnd(0, Math.PI*2), l = rnd(len*0.3, len);
    ctx.strokeStyle = 'rgba(' + rgb + ',' + rnd(0.02, maxA) + ')';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a)*l, y + Math.sin(a)*l); ctx.stroke();
  }
}
// Envelhece pôsteres/fotos: papel amarelado, manchas, dobras, bordas gastas, tinta desbotada
function ageCanvas(ctx, w, h) {
  ctx.fillStyle = 'rgba(150,115,50,0.28)'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(160,150,125,0.12)'; ctx.fillRect(0, 0, w, h);
  for (var i = 0; i < 12; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(15, 60), '55,32,10', rnd(0.1, 0.3));
  ctx.lineWidth = 2;
  [[w*0.5, 0, w*0.5, h], [0, h*0.5, w, h*0.5], [w*0.22, 0, w*0.3, h]].forEach(function(f) {
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.moveTo(f[0], f[1]); ctx.lineTo(f[2], f[3]); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,240,200,0.12)'; ctx.beginPath(); ctx.moveTo(f[0] + 2, f[1]); ctx.lineTo(f[2] + 2, f[3]); ctx.stroke();
  });
  var e = ctx.createLinearGradient(0, 0, 14, 0);
  e.addColorStop(0, 'rgba(20,10,4,0.6)'); e.addColorStop(1, 'rgba(20,10,4,0)');
  ctx.fillStyle = e; ctx.fillRect(0, 0, 14, h);
  e = ctx.createLinearGradient(0, h, 0, h - 14);
  e.addColorStop(0, 'rgba(20,10,4,0.6)'); e.addColorStop(1, 'rgba(20,10,4,0)');
  ctx.fillStyle = e; ctx.fillRect(0, h - 14, w, 14);
  ctx.fillStyle = 'rgba(15,8,4,0.7)';
  ctx.beginPath(); ctx.moveTo(w, 0); ctx.lineTo(w - 26, 0); ctx.lineTo(w, 30); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, h); ctx.lineTo(30, h); ctx.lineTo(0, h - 22); ctx.fill();
  scratches(ctx, w, h, 25, '0,0,0', 0.2, 40);
  addNoise(ctx, w, h, 80, 0.25, 3);
}

function makeFloorTex(repX, repY) {
  return makeTexture(512, function(ctx, w, h) {
    var ts = 128, r, c, i;
    for (r = 0; r < 4; r++) for (c = 0; c < 4; c++) {          // quadriculado com variação por ladrilho
      var v = (Math.random() * 9) | 0, d = (r + c) % 2 === 0;
      ctx.fillStyle = d ? 'rgb(' + (22+v) + ',' + (18+v) + ',' + (14+v) + ')' : 'rgb(' + (8+v/2|0) + ',' + (7+v/2|0) + ',' + (6+v/2|0) + ')';
      ctx.fillRect(c*ts, r*ts, ts, ts);
      blotch(ctx, c*ts + rnd(10, 118), r*ts + rnd(10, 118), rnd(20, 60), '0,0,0', rnd(0.1, 0.4));
    }
    for (i = 0; i < 6; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(30, 80), '40,28,14', 0.18);   // manchas discretas
    scratches(ctx, w, h, 70, '150,140,125', 0.1, 70);                                              // riscos
    for (i = 0; i < 25; i++) { ctx.fillStyle = 'rgba(70,62,52,' + rnd(0.1, 0.3) + ')'; ctx.fillRect(rnd(0, w), rnd(0, h), rnd(2, 6), rnd(1, 4)); } // lascas
    addNoise(ctx, w, h, 350, 0.5, 6);
    ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 4;
    for (i = 0; i <= 4; i++) {
      ctx.beginPath(); ctx.moveTo(i*ts, 0); ctx.lineTo(i*ts, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*ts); ctx.lineTo(w, i*ts); ctx.stroke();
    }
  }, repX, repY);
}

function makeWallTex(repX, repY) {
  return makeTexture(512, function(ctx, w, h) {
    var i;
    ctx.fillStyle = '#4a3a2e'; ctx.fillRect(0, 0, w, h);
    for (i = 0; i < 70; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(25, 90), (i % 3 ? '30,20,12' : '90,70,50'), rnd(0.05, 0.2)); // tinta envelhecida
    for (i = 0; i < 18; i++) {                                                   // escorridos de umidade
      var x = rnd(0, w), y = rnd(0, h * 0.6), l = rnd(60, 220), g = ctx.createLinearGradient(0, y, 0, y + l);
      g.addColorStop(0, 'rgba(12,7,3,0.3)'); g.addColorStop(1, 'rgba(12,7,3,0)');
      ctx.fillStyle = g; ctx.fillRect(x, y, rnd(3, 9), l);
    }
    for (i = 0; i < 9; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(40, 100), '10,8,4', 0.25);  // regiões gastas
    for (i = 0; i < 10; i++) {                                                   // rachaduras ramificadas
      var cx = rnd(0, w), cy = rnd(0, h);
      ctx.strokeStyle = 'rgba(0,0,0,' + rnd(0.3, 0.55) + ')'; ctx.lineWidth = rnd(0.8, 1.8);
      ctx.beginPath(); ctx.moveTo(cx, cy);
      for (var s = 0; s < 6; s++) { cx += rnd(-25, 25); cy += rnd(5, 40); ctx.lineTo(cx, cy); }
      ctx.stroke();
    }
    for (i = 0; i < 30; i++) { ctx.fillStyle = 'rgba(105,88,66,' + rnd(0.08, 0.2) + ')'; ctx.fillRect(rnd(0, w), rnd(0, h), rnd(3, 12), rnd(2, 7)); } // tinta descascada
    var gt = ctx.createLinearGradient(0, 0, 0, h);                               // sujeira acumulada em cima/embaixo
    gt.addColorStop(0, 'rgba(0,0,0,0.5)'); gt.addColorStop(0.2, 'rgba(0,0,0,0)');
    gt.addColorStop(0.8, 'rgba(0,0,0,0)'); gt.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = gt; ctx.fillRect(0, 0, w, h);
    var gs = ctx.createLinearGradient(0, 0, w, 0);
    gs.addColorStop(0, 'rgba(0,0,0,0.25)'); gs.addColorStop(0.1, 'rgba(0,0,0,0)');
    gs.addColorStop(0.9, 'rgba(0,0,0,0)'); gs.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = gs; ctx.fillRect(0, 0, w, h);
    addNoise(ctx, w, h, 300, 0.25, 3);
  }, repX, repY);
}

function makeWainscotTex(repX, repY) {
  return makeTexture(256, function(ctx, w, h) {
    ctx.fillStyle = '#3a1510'; ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 12; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(15, 50), '10,4,2', rnd(0.15, 0.35));
    scratches(ctx, w, h, 30, '150,100,80', 0.1, 40);
    addNoise(ctx, w, h, 120, 0.4, 5);
  }, repX, repY);
}

function makeWoodTex() {
  return makeTexture(512, function(ctx, w, h) {
    var i;
    ctx.fillStyle = '#3a2010'; ctx.fillRect(0, 0, w, h);
    for (i = 0; i < 8; i++) {                                                    // tábuas com tons diferentes
      ctx.fillStyle = 'rgba(' + (i % 2 ? '70,40,18' : '20,10,4') + ',' + rnd(0.1, 0.25) + ')';
      ctx.fillRect(0, i*h/8, w, h/8);
    }
    for (i = 0; i < 140; i++) {                                                  // veios
      var y = rnd(0, h);
      ctx.strokeStyle = (i % 3 ? 'rgba(15,7,3,' : 'rgba(110,70,35,') + rnd(0.05, 0.3) + ')'; ctx.lineWidth = rnd(0.5, 1.6);
      ctx.beginPath(); ctx.moveTo(0, y);
      ctx.bezierCurveTo(w*0.3, y + rnd(-9, 9), w*0.6, y + rnd(-9, 9), w, y + rnd(-6, 6)); ctx.stroke();
    }
    for (i = 0; i < 4; i++) {                                                    // nós
      var kx = rnd(40, w - 40), ky = rnd(20, h - 20);
      blotch(ctx, kx, ky, rnd(10, 20), '12,5,2', 0.7);
      ctx.strokeStyle = 'rgba(10,4,2,0.4)'; ctx.beginPath(); ctx.ellipse(kx, ky, 26, 9, 0, 0, Math.PI*2); ctx.stroke();
    }
    for (i = 0; i < 7; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(20, 60), '8,4,2', rnd(0.15, 0.4)); // manchas
    scratches(ctx, w, h, 90, '170,130,90', 0.14, 80);                            // riscos
    addNoise(ctx, w, h, 250, 0.3, 4);
  }, 1, 1);
}

function makeMetalTex() {
  return makeTexture(256, function(ctx, w, h) {
    var i;
    ctx.fillStyle = '#2a2c2f'; ctx.fillRect(0, 0, w, h);
    for (i = 0; i < 90; i++) {                                                   // escovado
      var x = rnd(0, w);
      ctx.strokeStyle = 'rgba(190,190,200,' + rnd(0.02, 0.1) + ')'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + rnd(-2, 2), h); ctx.stroke();
    }
    scratches(ctx, w, h, 45, '210,210,215', 0.22, 60);                           // riscos
    for (i = 0; i < 9; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(8, 30), '120,56,22', rnd(0.15, 0.45)); // oxidação
    for (i = 0; i < 6; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(15, 40), '6,6,6', 0.35);
    var ed = ctx.createLinearGradient(0, 0, 0, h);
    ed.addColorStop(0, 'rgba(0,0,0,0.35)'); ed.addColorStop(0.15, 'rgba(0,0,0,0)');
    ed.addColorStop(0.85, 'rgba(0,0,0,0)'); ed.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = ed; ctx.fillRect(0, 0, w, h);
    addNoise(ctx, w, h, 120, 0.3, 3);
  }, 1, 1);
}

/* ================================================================
   HELPERS
   ================================================================ */
function addMesh(geo, mat, x, y, z, parent) {
  var m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m);
  return m;
}
function box(w, h, d) { return new THREE.BoxGeometry(w, h, d); }
function cyl(rt, rb, h, s) { return new THREE.CylinderGeometry(rt, rb, h, s || 16); }
function plane(w, h) { return new THREE.PlaneGeometry(w, h); }

/* ================================================================
   SALA
   ================================================================ */
function buildRoom() {
  var W = S.ROOM_W, D = S.ROOM_D, H = S.ROOM_H, T = S.WALL_T;

  addMesh(box(W, 0.12, D), MAT.floor, 0, -0.06, 0);
  addMesh(box(W, 0.14, D), MAT.ceiling, 0, H + 0.07, 0);

  // Parede do fundo
  addMesh(box(W, H, T), MAT.wall, 0, H/2, GEO.backZ - T/2);
  addMesh(box(W - 0.02, 1.05, 0.02), MAT.wainscot, 0, 0.525, GEO.backZ + 0.01);
  addMesh(box(W - 0.02, 0.05, 0.03), MAT.trim, 0, 1.05, GEO.backZ + 0.018);

  // Parede frontal
  addMesh(box(W, H, T), MAT.wall, 0, H/2, GEO.frontZ + T/2);
  addMesh(box(W - 0.02, 1.05, 0.02), MAT.wainscot, 0, 0.525, GEO.frontZ - 0.01);

  buildSideWall('left');
  buildSideWall('right');
}

function buildSideWall(side) {
  var isLeft = (side === 'left');
  var W = S.ROOM_W, H = S.ROOM_H, T = S.WALL_T;
  var wallX = isLeft ? GEO.leftX : GEO.rightX;
  var sign = isLeft ? -1 : 1;
  var xPos = wallX + sign * T/2;

  var doorZ0 = GEO.doorZ0, doorZ1 = GEO.doorZ1;
  var winZ0 = GEO.winZ0, winZ1 = GEO.winZ1;
  var backZ = GEO.backZ, frontZ = GEO.frontZ;

  // Bloco 1: fundo → porta
  var b1 = doorZ0 - backZ;
  if (b1 > 0.01) addMesh(box(T, H, b1), MAT.wall, xPos, H/2, backZ + b1/2);

  // Bloco 2: porta → janela (pilar fino)
  var b2 = winZ0 - doorZ1;
  if (b2 > 0.01) addMesh(box(T, H, b2), MAT.wall, xPos, H/2, doorZ1 + b2/2);

  // Bloco 3: janela → frente
  var b3 = frontZ - winZ1;
  if (b3 > 0.01) addMesh(box(T, H, b3), MAT.wall, xPos, H/2, winZ1 + b3/2);

  // Acima da porta
  addMesh(box(T, H - S.DOOR_H, doorZ1 - doorZ0), MAT.wall, xPos, S.DOOR_H + (H - S.DOOR_H)/2, (doorZ0 + doorZ1)/2);

  // Janela — abaixo e acima
  addMesh(box(T, S.WIN_Y, winZ1 - winZ0), MAT.wall, xPos, S.WIN_Y/2, (winZ0 + winZ1)/2);
  addMesh(box(T, H - S.WIN_Y - S.WIN_H, winZ1 - winZ0), MAT.wall, xPos,
    S.WIN_Y + S.WIN_H + (H - S.WIN_Y - S.WIN_H)/2, (winZ0 + winZ1)/2);

  // Wainscot (só nas partes baixas sólidas)
  var wainsX = xPos + sign * (T/2 + 0.003);
  if (b1 > 0.01) addMesh(box(0.02, 1.05, b1), MAT.wainscot, wainsX, 0.525, backZ + b1/2);
  if (b3 > 0.01) addMesh(box(0.02, 1.05, b3), MAT.wainscot, wainsX, 0.525, winZ1 + b3/2);

  // Rodapé
  var trimX = xPos + sign * (T/2 + 0.006);
  if (b1 > 0.01) addMesh(box(0.03, 0.06, b1), MAT.trim, trimX, 1.05, backZ + b1/2);
  if (b3 > 0.01) addMesh(box(0.03, 0.06, b3), MAT.trim, trimX, 1.05, winZ1 + b3/2);
}

/* ================================================================
   CORREDOR — ALINHADO EM Z COM AS PORTAS (correção principal)
   ================================================================ */
function buildCorridor(side) {
  // Corredor paralelo à lateral da sala: começa pouco atrás do fundo da sala e corre
  // PARA A FRENTE (+Z), passando da frente da sala, como no croqui do usuário.
  var s = (side === 'left') ? -1 : 1;
  var T = S.WALL_T, H = S.COR_H, LEN = S.COR_LEN;
  var XI = S.ROOM_W/2 + T;           // face externa da parede da sala
  var XO = XI + S.COR_W;             // parede externa do corredor (face interna)
  var z1 = S.COR_Z1, z0 = z1 - LEN, zc = (z0 + z1) / 2;
  var fw = XO - S.ROOM_W/2;          // largura do piso/teto
  var fcx = s * (S.ROOM_W/2 + XO) / 2;
  var ccx = s * (XI + XO) / 2;       // eixo central do corredor
  var backZ = GEO.backZ, frontZ = GEO.frontZ;
  var ib = backZ - z0, ifr = z1 - frontZ;   // trechos da parede interna fora da sala

  // Materiais com repetição proporcional (sem esticar texturas)
  var wallMat = makeMat(0x8a847e, 0.92, 0.05, { map: makeWallTex(LEN/2.5, 1) });
  var floorMat = makeMat(0xffffff, 0.82, 0.12, { map: makeFloorTex(fw, LEN) });

  // Piso e teto
  addMesh(box(fw, 0.12, LEN), floorMat, fcx, -0.06, zc);
  addMesh(box(fw, 0.12, LEN), MAT.ceiling, fcx, H + 0.06, zc);

  // Paredes: externa (longa), interna (continua a parede da sala após o fundo dela), topo e fundo
  addMesh(box(T, H, LEN), wallMat, s * (XO + T/2), H/2, zc);
  addMesh(box(T, H, ib), wallMat, s * (S.ROOM_W/2 + T/2), H/2, (backZ + z0) / 2);
  addMesh(box(T, H, ifr), wallMat, s * (S.ROOM_W/2 + T/2), H/2, (frontZ + z1) / 2);
  var capW = XO + T - XI, capX = s * (XI + XO + T) / 2;
  addMesh(box(capW, H, T), MAT.metalDark, capX, H/2, z1 + T/2); // ponta da frente (escura)
  addMesh(box(capW, H, T), MAT.wall, capX, H/2, z0 - T/2);      // fundo atrás da porta

  // Rodapé escuro / lambri
  addMesh(box(0.02, 1.05, LEN), MAT.wainscot, s * (XO - 0.01), 0.525, zc);
  addMesh(box(0.02, 1.05, ib), MAT.wainscot, s * (XI + 0.01), 0.525, (backZ + z0) / 2);
  addMesh(box(0.02, 1.05, ifr), MAT.wainscot, s * (XI + 0.01), 0.525, (frontZ + z1) / 2);
  addMesh(box(0.03, 0.1, LEN), MAT.trim, s * (XO - 0.015), 0.05, zc);
  addMesh(box(0.03, 0.1, ib), MAT.trim, s * (XI + 0.015), 0.05, (backZ + z0) / 2);
  addMesh(box(0.03, 0.1, ifr), MAT.trim, s * (XI + 0.015), 0.05, (frontZ + z1) / 2);

  // Vigas metálicas no teto (a cada 2 m)
  for (var z = z1 - 1.5; z > z0; z -= 2.0) addMesh(box(fw, 0.08, 0.09), MAT.metalOld, fcx, H - 0.04, z);

  // Conduítes e canos correndo ao longo do corredor
  var p1 = addMesh(cyl(0.035, 0.035, LEN - 0.4, 8), MAT.metalDark, s * (XO - 0.3), H - 0.1, zc);
  p1.rotation.x = Math.PI/2;
  var p2 = addMesh(cyl(0.028, 0.028, LEN - 0.4, 8), MAT.metalRust, s * (XI + 0.3), H - 0.16, zc);
  p2.rotation.x = Math.PI/2;
  var p3 = addMesh(cyl(0.05, 0.05, LEN - 0.4, 8), MAT.metalRust, s * (XO - 0.15), 0.18, zc);
  p3.rotation.x = Math.PI/2;

  // Fios pendurados em curva ao longo da parede externa
  var pts = [], i;
  for (i = 0, z = z1 - 0.3; z > z0 + 0.5; z -= 1.6, i++)
    pts.push(new THREE.Vector3(s * (XO - 0.12), (i % 2 ? 2.12 : 2.38), z));
  addMesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 60, 0.012, 5, false), MAT.plasticBlack, 0, 0, 0);

  // Luminárias: a luz diminui com a distância (o fog escurece o resto)
  objs['corr_bulbs_' + side] = [];
  objs['corr_lights_' + side] = [];
  var lampZ = [-2.4, 0.2, 2.4, 0], lampI = [0.5, 0.3, 0.16, 0];
  for (var k = 0; k < lampZ.length; k++) {
    addMesh(cyl(0.1, 0.12, 0.1, 12), MAT.metalDark, ccx, H - 0.12, lampZ[k]);
    var ring = addMesh(new THREE.TorusGeometry(0.11, 0.006, 6, 16), MAT.metalDark, ccx, H - 0.16, lampZ[k]);
    ring.rotation.x = Math.PI/2;
    objs['corr_bulbs_' + side].push(addMesh(cyl(0.055, 0.055, 0.06, 12), MAT.bulbCorr, ccx, H - 0.18, lampZ[k]));
    if (lampI[k] > 0) {
      var pl = new THREE.PointLight(0xb8d0e8, lampI[k], 3.5, 2);
      pl.position.set(ccx, H - 0.3, lampZ[k]);
      scene.add(pl);
      objs['corr_lights_' + side].push(pl);
    }
  }

  // Pequenas portas de manutenção na parede externa
  var doorZs = [1.8];
  for (k = 0; k < doorZs.length; k++) {
    var dx = s * (XO - 0.03);
    addMesh(box(0.06, 2.05, 1.05), MAT.metalDark, dx, 1.025, doorZs[k]);
    addMesh(box(0.05, 1.95, 0.9), MAT.metalOld, s * (XO - 0.06), 0.975, doorZs[k]);
    addMesh(box(0.04, 0.05, 0.12), MAT.metalBrass, s * (XO - 0.09), 1.0, doorZs[k] + 0.3);
    addMesh(box(0.02, 0.12, 0.2), MAT.paperYellow, s * (XO - 0.09), 1.75, doorZs[k]);
    addMesh(box(0.02, 0.03, 0.03), k === 1 ? MAT.ledGreen : MAT.ledRed, s * (XO - 0.09), 1.95, doorZs[k] - 0.3);
  }

  // Portinha no fundo do corredor (visível pela porta da sala)
  addMesh(box(1.05, 2.05, 0.06), MAT.metalDark, ccx, 1.025, z0 + 0.03);
  addMesh(box(0.9, 1.95, 0.05), MAT.metalOld, ccx, 0.975, z0 + 0.06);
  addMesh(box(0.12, 0.04, 0.02), MAT.ledRed, ccx, 2.0, z0 + 0.09);
  // Ponto de luz distante: luminária de emergência no fundo do corredor
  addMesh(box(0.2, 0.06, 0.03), MAT.ledAmber, ccx, 2.3, z0 + 0.06);
  addMesh(box(0.14, 0.05, 0.02), MAT.ledGreen, s * (XO - 0.9), 2.25, z0 + 0.06);

  // Cartazes (parede externa e parede interna)
  var cv = document.createElement('canvas'); cv.width = 128; cv.height = 160;
  var c = cv.getContext('2d');
  c.fillStyle = '#7a5a30'; c.fillRect(0, 0, 128, 160);
  c.fillStyle = '#4a2a10'; c.beginPath(); c.arc(64, 55, 30, 0, Math.PI*2); c.fill();
  c.fillStyle = '#2a1810'; c.font = 'bold 13px Courier'; c.textAlign = 'center';
  c.fillText("FREDDY'S", 64, 115); c.fillText('PIZZA', 64, 132);
  c.fillStyle = 'rgba(0,0,0,0.9)'; c.beginPath();
  c.moveTo(0, 90); c.lineTo(30, 80); c.lineTo(20, 130); c.lineTo(50, 120); c.lineTo(40, 155); c.lineTo(0, 160);
  c.closePath(); c.fill();
  ageCanvas(c, 128, 160);
  var posterMat = new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(cv), roughness: 0.92, metalness: 0.02 });
  [[-2.1, 1.5, 0.6, 0.75], [2.7, 1.45, 0.4, 0.55]].forEach(function(p) {
    var m = new THREE.Mesh(plane(p[2], p[3]), posterMat);
    m.position.set(s * (XO - 0.02), p[1], p[0]); m.rotation.y = -s * Math.PI/2; scene.add(m);
  });
  [[-3.0, 1.4, 0.5, 0.65]].forEach(function(p) {
    var m = new THREE.Mesh(plane(p[2], p[3]), posterMat);
    m.position.set(s * (XI + 0.02), p[1], p[0]); m.rotation.y = s * Math.PI/2; scene.add(m);
  });

  // Objetos de manutenção: caixas, extintor, caixa de fusíveis, válvula
  var cr1 = addMesh(box(0.5, 0.4, 0.4), MAT.woodDark, s * (XO - 0.45), 0.2, -2.2); cr1.rotation.y = 0.3;
  var cr2 = addMesh(box(0.4, 0.35, 0.4), MAT.woodDark, s * (XI + 0.4), 0.175, -3.0); cr2.rotation.y = -0.5;
  addMesh(box(0.35, 0.3, 0.35), MAT.woodDark, s * (XO - 0.5), 0.15, 0.8);
  addMesh(cyl(0.09, 0.09, 0.3, 10), makeMat(0x8a2020, 0.55, 0.4), s * (XO - 0.14), 0.9, -1.7);
  addMesh(box(0.1, 0.5, 0.4), MAT.metalDark, s * (XO - 0.07), 1.4, -2.9);
  addMesh(box(0.02, 0.04, 0.04), MAT.ledGreen, s * (XO - 0.13), 1.55, -2.8);
  var valve = addMesh(new THREE.TorusGeometry(0.07, 0.012, 6, 14), MAT.metalBrass, s * (XO - 0.2), 0.3, 2.6);
  valve.rotation.y = Math.PI/2;

  // Silhueta distante no fundo do corredor esquerdo: quase invisível, deixa a dúvida
  if (side === 'left') {
    var sil = new THREE.Group(); sil.position.set(ccx + 0.35, 0, z0 + 0.5);
    var sm = makeMat(0x030202, 0.95, 0.0);
    addMesh(box(0.5, 1.0, 0.3), sm, 0, 0.85, 0, sil);
    addMesh(new THREE.SphereGeometry(0.2, 12, 10), sm, 0, 1.6, 0, sil);
    [-0.15, 0.15].forEach(function(ex) { addMesh(new THREE.SphereGeometry(0.07, 8, 6), sm, ex, 1.83, -0.02, sil); });
    [-0.15, 0.15].forEach(function(lx) { addMesh(box(0.14, 0.7, 0.14), sm, lx, 0.35, 0, sil); });
    [-0.07, 0.07].forEach(function(ex) { addMesh(new THREE.SphereGeometry(0.012, 6, 4), MAT.ledRed, ex, 1.62, 0.18, sil); });
    scene.add(sil);
  }

  // Câmera de segurança (olha para a porta)
  var g = new THREE.Group();
  g.position.set(s * (XO - 0.3), H - 0.35, -2.9);
  addMesh(box(0.08, 0.08, 0.08), MAT.metalDark, 0, 0, 0, g);
  var body = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 8, 0, Math.PI*2, 0, Math.PI*0.7), MAT.plasticBlack);
  body.rotation.x = Math.PI/2; body.position.z = 0.1; g.add(body);
  var led = new THREE.Mesh(cyl(0.005, 0.005, 0.006, 8), MAT.ledRed);
  led.rotation.x = Math.PI/2; led.position.set(0.03, 0.02, 0.14); g.add(led);
  g.rotation.x = 0.25; g.rotation.y = -s * 0.5;
  scene.add(g);
}

/* ================================================================
   LUZES FUNCIONAIS DOS CORREDORES (quando jogador aperta LUZ)
   ================================================================ */
function buildCorridorFunctionalLights() {
  // Luz esquerda - posicionada próxima à porta esquerda
  var doorZc = (GEO.doorZ0 + GEO.doorZ1) / 2;
  var lL = new THREE.PointLight(0xffcc88, 0, 5.5, 2);
  lL.position.set(GEO.leftX - 1.8, S.COR_H - 0.4, doorZc);
  scene.add(lL);
  objs.corrLightLeft = lL;

  // Luz direita
  var lR = new THREE.PointLight(0xffcc88, 0, 5.5, 2);
  lR.position.set(GEO.rightX + 1.8, S.COR_H - 0.4, doorZc);
  scene.add(lR);
  objs.corrLightRight = lR;

  // Luz externa adicional (mais ao fundo)
  var bL = new THREE.PointLight(0xaaccdd, 0, 4.0, 2);
  bL.position.set(GEO.leftX - 1.5, S.COR_H - 0.4, doorZc + 3.5);
  scene.add(bL);
  objs.corrBackLightLeft = bL;

  var bR = new THREE.PointLight(0xaaccdd, 0, 4.0, 2);
  bR.position.set(GEO.rightX + 1.5, S.COR_H - 0.4, doorZc + 3.5);
  scene.add(bR);
  objs.corrBackLightRight = bR;
}

/* ================================================================
   PORTA (rolling shutter) — animação vertical
   ================================================================ */
function buildDoor(side) {
  var isLeft = (side === 'left');
  var wallX = isLeft ? GEO.leftX : GEO.rightX;
  var sign = isLeft ? -1 : 1;
  var DW = S.DOOR_W, DH = S.DOOR_H;
  var dz0 = GEO.doorZ0, dz1 = GEO.doorZ1;
  var dzc = (dz0 + dz1) / 2;

  // TRILHOS verticais
  var railX = wallX + sign * 0.06;
  addMesh(box(0.06, DH + 0.35, 0.07), MAT.metalDark, railX, (DH + 0.35)/2, dz0 - 0.04);
  addMesh(box(0.06, DH + 0.35, 0.07), MAT.metalDark, railX, (DH + 0.35)/2, dz1 + 0.04);

  // Batente superior
  addMesh(box(0.15, 0.04, DW + 0.15), MAT.metalOld, wallX + sign * 0.08, DH + 0.02, dzc);

  // Compartimento superior (onde a porta se esconde)
  addMesh(box(0.24, 0.4, DW + 0.2), MAT.metalOld, wallX + sign * 0.12, DH + 0.22, dzc);
  addMesh(box(0.05, 0.1, DW + 0.1), MAT.ledAmber, wallX + sign * 0.08, DH + 0.42, dzc);

  // A PORTA
  var group = new THREE.Group();
  group.position.set(wallX + sign * 0.08, DH, dzc);

  var segCount = 11, segH = DH / segCount, swW = DW - 0.08;

  for (var i = 0; i < segCount; i++) {
    var segY = -segH/2 - i * segH;
    var seg = new THREE.Mesh(box(0.08, segH - 0.008, swW), MAT.metal);
    seg.position.set(0, segY, 0);
    seg.castShadow = true; seg.receiveShadow = true;
    group.add(seg);
    var groove = new THREE.Mesh(box(0.085, 0.007, swW), MAT.metalDark);
    groove.position.set(0, segY - segH/2 + 0.005, 0);
    group.add(groove);
  }

  // Rebites verticais
  for (var zz = -1; zz <= 1; zz += 2) {
    for (var r = 0; r < segCount; r += 2) {
      var riv = new THREE.Mesh(cyl(0.008, 0.008, 0.09, 6), MAT.metalBrass);
      riv.rotation.x = Math.PI/2;
      riv.position.set(0, -segH/2 - r*segH - segH/2, zz * swW * 0.32);
      group.add(riv);
    }
  }

  // Faixa amarela no meio
  for (var s = 0; s < 3; s++) {
    var stripe = new THREE.Mesh(box(0.085, 0.055, swW * 0.7), s % 2 === 0 ? MAT.ledAmber : MAT.metalDark);
    stripe.position.set(0, -DH * 0.38 - s * 0.06, 0);
    group.add(stripe);
  }

  // Alça
  var handleBase = new THREE.Mesh(box(0.04, 0.06, 0.16), MAT.metalBrass);
  handleBase.position.set(sign * 0.06, -DH * 0.32, 0);
  group.add(handleBase);
  var handleBar = new THREE.Mesh(cyl(0.013, 0.013, 0.2, 8), MAT.metalBrass);
  handleBar.rotation.x = Math.PI/2;
  handleBar.position.set(sign * 0.08, -DH * 0.32, 0);
  group.add(handleBar);

  group.traverse(function(o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(group);
  objs['door_' + side] = group;
  objs['doorSegH_' + side] = segH;

  // Começa ABERTA
  group.position.y = 2 * DH;

  // LED vermelho acima da porta
  var ledAbove = addMesh(cyl(0.045, 0.045, 0.06, 12), MAT.ledRed,
    wallX + sign * 0.15, DH + 0.55, dzc);
  ledAbove.rotation.z = Math.PI/2;
  objs['door_led_' + side] = ledAbove;

  // Halo físico
  var halo = new THREE.PointLight(0xff2200, 0.5, 2.0, 2);
  halo.position.set(wallX + sign * 0.5, DH + 0.5, dzc);
  scene.add(halo);
  objs['door_halo_' + side] = halo;

  // Painel de emergência lateral
  var panel = new THREE.Group();
  panel.position.set(wallX + sign * 0.1, 1.3, dz1 + 0.35);
  addMesh(box(0.12, 0.4, 0.15), makeMat(0x1a0505, 0.7, 0.1), 0, 0, 0, panel);
  addMesh(box(0.08, 0.12, 0.01), MAT.ledRed, 0, 0.11, 0.08, panel);
  addMesh(box(0.08, 0.12, 0.01), MAT.ledWhite, 0, -0.11, 0.08, panel);
  scene.add(panel);

  // Luz vermelha da porta (fechada)
  var dLight = new THREE.PointLight(0xff1a00, 0, 2.5, 2);
  dLight.position.set(wallX + sign * 0.6, 1.2, dzc);
  scene.add(dLight);
  objs['door_light_' + side] = dLight;
}

function buildWindowSmall(side) {

  var wzc = (wz0 + wz1) / 2;
  var winH = S.WIN_H, winY = S.WIN_Y;

  addMesh(box(0.03, winH, 0.035), MAT.metalDark, xPos, winY + winH/2, wzc);

    sc.rotation.z = Math.PI/2;

  }

  // VIDRO
  var glassMesh = new THREE.Mesh(box(0.045, winH, wz1 - wz0), MAT.glass);

    makeMat(0xffffff, 0.08, 0.0, { transparent: true, opacity: 0.05, side: THREE.DoubleSide }));

  refl.rotation.y = sign > 0 ? -Math.PI/2 : Math.PI/2;

function buildDesk() {
  var DW = S.DESK_W, DD = S.DESK_D, DH = S.DESK_H, DT = S.DESK_T;
  var dZ = -0.35;   // mesa ~0.25 m mais perto do jogador

  addMesh(box(DW + 0.012, 0.008, DD + 0.012), MAT.woodDark, 0, DH - DT, dZ);

  addMesh(box(0.07, DH - DT, DD - 0.05), MAT.woodDark, -DW/2 + 0.06, (DH - DT)/2, dZ);
  addMesh(box(0.07, DH - DT, DD - 0.05), MAT.woodDark, DW/2 - 0.06, (DH - DT)/2, dZ);

  // 3 gavetas
  for (var i = 0; i < 3; i++) {
    var dx = -DW/2 + DW/6 + i * DW/3;
    var dw = DW/3 - 0.12;
    var dh = 0.19;
    var dy = DH - DT - 0.16;

    addMesh(box(dw - 0.02, 0.005, 0.028), MAT.woodDark, dx, dy + dh/2 - 0.01, dZ + DD/2 - 0.011);
    var hb = addMesh(cyl(0.007, 0.007, 0.14, 8), MAT.metalBrass, dx, dy, dZ + DD/2 + 0.025);
    hb.rotation.x = Math.PI/2;

  // Riscos
  for (var k = 0; k < 6; k++) {

  }

  // Desgaste nos cantos, poeira e manchas (cada marca é uma textura translúcida sobre o tampo)
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function(q) {
    addMesh(box(0.05, 0.004, 0.05), MAT.woodDark, q[0] * (DW/2 - 0.02), DH + 0.001, dZ + q[1] * (DD/2 - 0.02)).rotation.y = 0.5;
  });
  var dc = document.createElement('canvas'); dc.width = 1024; dc.height = 256;

  for (var di = 0; di < 22; di++) blotch(dx2, rnd(0, 1024), rnd(0, 256), rnd(20, 90), '150,142,128', rnd(0.04, 0.12));
  for (di = 0; di < 5; di++) blotch(dx2, rnd(0, 1024), rnd(0, 256), rnd(15, 45), '8,4,2', rnd(0.3, 0.5));
  dx2.strokeStyle = 'rgba(12,6,2,0.5)'; dx2.lineWidth = 3;                    // anel de copo
  dx2.beginPath(); dx2.arc(300, 150, 18, 0, Math.PI*2); dx2.stroke();
  dx2.beginPath(); dx2.arc(312, 140, 16, 0.3, 5.4); dx2.stroke();
  addNoise(dx2, 1024, 256, 500, 0.3, 2);
  var dust = new THREE.Mesh(plane(DW - 0.02, DD - 0.02), new THREE.MeshStandardMaterial({
    map: new THREE.CanvasTexture(dc), transparent: true, roughness: 1, metalness: 0, depthWrite: false }));
  dust.rotation.x = -Math.PI/2; dust.position.set(0, DH + 0.0015, dZ);

  objs.deskZ = dZ;
}

  motor.position.y = 0.02;
  fanGroup.add(motor);

  // Aro externo (em volta das pás) e grade frontal — anéis voltados para +Z
  var rim = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.014, 10, 36), MAT.metalRust);
  rim.position.z = 0.08;
  fanGroup.add(rim);
  var rimBack = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.01, 8, 36), MAT.metalRust);
  rimBack.position.z = 0.0;
  fanGroup.add(rimBack);
  var radii = [0.2, 0.14, 0.09, 0.045];
  for (var i = 0; i < radii.length; i++) {
    var ring = new THREE.Mesh(new THREE.TorusGeometry(radii[i], 0.005, 8, 28), MAT.metalRust);
    ring.position.z = 0.14;
    fanGroup.add(ring);
  }
  for (var k = 0; k < 6; k++) {
    var bar = new THREE.Mesh(box(0.006, 0.4, 0.006), MAT.metalRust);
    bar.rotation.z = k * Math.PI/6;
    bar.position.z = 0.14;
    fanGroup.add(bar);
  }
  // Hastes ligando a grade ao motor
  for (var h = 0; h < 4; h++) {
    var ha = h * Math.PI/2 + Math.PI/4;
    var strut = new THREE.Mesh(box(0.006, 0.006, 0.14), MAT.metalRust);
    strut.position.set(Math.cos(ha) * 0.2, Math.sin(ha) * 0.2, 0.07);
    fanGroup.add(strut);
  }

  // Pás: largas no plano XY, finas em Z e inclinadas; giram em torno de Z, à frente do motor
  var bladesGroup = new THREE.Group();
  bladesGroup.position.z = 0.1;
  var hub = new THREE.Mesh(cyl(0.035, 0.035, 0.04, 14), MAT.metalDark);
  hub.rotation.x = Math.PI/2;
  bladesGroup.add(hub);
  for (var j = 0; j < 3; j++) {
    var pivot = new THREE.Group();
    pivot.rotation.z = j * (Math.PI * 2 / 3);
    var blade = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.15, 0.012), MAT.metalOld);
    blade.position.set(0, 0.11, 0);
    blade.rotation.y = 0.45;
    pivot.add(blade);
    bladesGroup.add(pivot);
  }
  fanGroup.add(bladesGroup);
  fanBlades = bladesGroup;

  // Parafusos, botão de oscilação, placa, ferrugem, cabo e poeira
  for (var sa = 0; sa < 4; sa++) {
    var ang = sa*Math.PI/2 + Math.PI/4;
    var fs = new THREE.Mesh(cyl(0.008, 0.008, 0.012, 6), MAT.metalBrass);
    fs.rotation.x = Math.PI/2; fs.position.set(Math.cos(ang)*0.2, Math.sin(ang)*0.2, 0.095); fanGroup.add(fs);
    var ms = new THREE.Mesh(cyl(0.006, 0.006, 0.01, 6), MAT.metalBrass);
    ms.rotation.x = Math.PI/2; ms.position.set(Math.cos(ang)*0.06, 0.02 + Math.sin(ang)*0.06, -0.072); fanGroup.add(ms);
  }
  var knob = new THREE.Mesh(cyl(0.012, 0.012, 0.03, 8), MAT.metalDark);
  knob.position.set(0, 0.12, -0.04); fanGroup.add(knob);
  var fplate = new THREE.Mesh(box(0.07, 0.02, 0.002), MAT.metalBrass);
  fplate.position.set(0, -0.32, 0.162); fanGroup.add(fplate);
  var rustMat = makeMat(0x6a3416, 0.95, 0.2);
  for (var ri = 0; ri < 7; ri++) {
    var rp = new THREE.Mesh(box(rnd(0.015, 0.04), rnd(0.008, 0.02), 0.003), rustMat);
    var rang = rnd(0, Math.PI*2); rp.position.set(Math.cos(rang)*0.2, Math.sin(rang)*0.2, 0.082); rp.rotation.z = rang; fanGroup.add(rp);
  }
  var fcab = new THREE.CatmullRomCurve3([new THREE.Vector3(0.04, -0.33, -0.1), new THREE.Vector3(0.12, -0.345, -0.28),
    new THREE.Vector3(0.0, -0.345, -0.5), new THREE.Vector3(-0.1, -0.345, -0.8)]);
  fanGroup.add(new THREE.Mesh(new THREE.TubeGeometry(fcab, 24, 0.009, 6, false), MAT.plasticBlack));
  var fdust = new THREE.Mesh(new THREE.CircleGeometry(0.2, 28), new THREE.MeshBasicMaterial({
    color: 0x8a8478, transparent: true, opacity: 0.05, depthWrite: false }));
  fdust.position.z = 0.143; fanGroup.add(fdust);

  fanGroup.traverse(function(o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(fanGroup);
  objs.fan = fanGroup;
}

function buildWallDecor() {
  var backZ = GEO.backZ;

  // Sombras de canto (oclusão ambiente): teto/paredes e quinas verticais
  var shc = document.createElement('canvas'); shc.width = 4; shc.height = 64;
  var shx = shc.getContext('2d'), shg = shx.createLinearGradient(0, 0, 0, 64);
  shg.addColorStop(0, 'rgba(0,0,0,0.7)'); shg.addColorStop(1, 'rgba(0,0,0,0)');
  shx.fillStyle = shg; shx.fillRect(0, 0, 4, 64);
  var shMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shc), transparent: true, depthWrite: false });
  var H2 = S.ROOM_H;
  function shade(w, h, x, y, z, ry, rz) {
    var m = new THREE.Mesh(plane(w, h), shMat); m.position.set(x, y, z);
    m.rotation.y = ry; m.rotation.z = rz || 0; scene.add(m);
  }
  shade(S.ROOM_W, 0.55, 0, H2 - 0.275, backZ + 0.004, 0);
  shade(S.ROOM_D, 0.55, -S.ROOM_W/2 + 0.004, H2 - 0.275, 0, Math.PI/2);
  shade(S.ROOM_D, 0.55, S.ROOM_W/2 - 0.004, H2 - 0.275, 0, -Math.PI/2);
  shade(0.6, H2, -S.ROOM_W/2 + 0.3, H2/2, backZ + 0.005, 0, Math.PI/2);
  shade(0.6, H2, S.ROOM_W/2 - 0.3, H2/2, backZ + 0.005, 0, -Math.PI/2);


  // Foto antiga
  drawFramed({
    x: -1.3, y: 1.7, z: backZ + 0.06, w: 0.55, h: 0.42, rotZ: -0.02,
    draw: function(ctx, w, h) {
      ctx.fillStyle = '#3a2818'; ctx.fillRect(0, 0, w, h);
      var cols = ['#7a4a20', '#4a3a70', '#c8a838', '#8a2820'];
      for (var i = 0; i < 4; i++) {
        var px = w * (0.18 + i * 0.22), py = h * 0.55;
        ctx.fillStyle = cols[i];
        ctx.beginPath(); ctx.ellipse(px, py + h*0.08, w*0.07, h*0.16, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(px, py - h*0.15, w*0.065, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(220,30,10,0.95)';
        ctx.beginPath();
        ctx.arc(px - w*0.025, py - h*0.15, 2.5, 0, Math.PI*2);
        ctx.arc(px + w*0.025, py - h*0.15, 2.5, 0, Math.PI*2);
        ctx.fill();
      }
    }
  });

  // Pôster Freddy
  drawFramed({
    x: 1.35, y: 1.7, z: backZ + 0.06, w: 0.65, h: 0.85, rotZ: 0.02,
    draw: function(ctx, w, h) {
      ctx.fillStyle = '#2a1810'; ctx.fillRect(0, 0, w, h);

      vg.addColorStop(0, '#6a3a18'); vg.addColorStop(1, '#1a0804');

  ccBody.position.z = 0.16;
  camSec.add(ccBody);
  var ccLed = new THREE.Mesh(cyl(0.007, 0.007, 0.01, 8), MAT.ledRed);
  ccLed.rotation.x = Math.PI/2;
  ccLed.position.set(0.045, 0.025, 0.2);
  camSec.add(ccLed);
  camSec.rotation.y = -0.7;
  camSec.rotation.x = 0.28;
  scene.add(camSec);
  objs.secCamLed = ccLed;
}

function drawFramed(opts) {
  var g = new THREE.Group();
  g.position.set(opts.x, opts.y, opts.z);
  g.rotation.z = opts.rotZ || 0;
  var w = opts.w, h = opts.h;
  var fT = 0.035, fD = 0.045;

  addMesh(box(fT, h + fT*2, fD), MAT.woodDark, -w/2 + fT/2, 0, fD/2, g);
  addMesh(box(fT, h + fT*2, fD), MAT.woodDark, w/2 - fT/2, 0, fD/2, g);
  addMesh(box(w + fT*2, fT, fD), MAT.woodDark, 0, -h/2 + fT/2, fD/2, g);
  addMesh(box(w + fT*2, fT, fD), MAT.woodDark, 0, h/2 - fT/2, fD/2, g);

  var cvs = document.createElement('canvas');
  cvs.width = 320; cvs.height = 400;
  var ctx = cvs.getContext('2d');
  opts.draw(ctx, 320, 400);
  ageCanvas(ctx, 320, 400);
  var tex = new THREE.CanvasTexture(cvs);

  var img = new THREE.Mesh(plane(w, h),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.88, metalness: 0.04 }));
  img.position.z = 0.014;
  g.add(img);

  scene.add(g);
}

/* ================================================================
   ILUMINAÇÃO AMBIENTAL
   ================================================================ */
function setupLighting() {
  scene.add(new THREE.AmbientLight(0x100c0a, 0.35));
  // Mesa e centro: luz quente e fraca
  var deskWarm = new THREE.PointLight(0xffa860, 0.45, 3.4, 2);
  deskWarm.position.set(0, 1.55, objs.deskZ + 0.7);
  scene.add(deskWarm);
  // Paredes: iluminação indireta bem fraca
  [-1, 1].forEach(function(sd) {
    var bounce = new THREE.PointLight(0x6a4a30, 0.12, 3.2, 2);
    bounce.position.set(sd * 1.6, 2.2, -1.6);
    scene.add(bounce);
  });

  var emergency = new THREE.PointLight(0x8a1810, 0.25, 4.0, 2);
  emergency.position.set(0, 2.4, 0);
  scene.add(emergency);
}

/* ================================================================
   INIT
   ================================================================ */
function showError(msg) {
  var el = document.getElementById('loading-err');
  if (el) { el.textContent = 'ERRO: ' + msg; el.classList.remove('hidden'); }
  if (window.console) console.error(msg);
}

function init() {
  try {
    var container = document.getElementById('game');
    if (!container) throw new Error('Container não encontrado');

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.insertBefore(renderer.domElement, container.firstChild);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050403);
    scene.fog = new THREE.FogExp2(0x080605, 0.04);

    // FOV maior para caber os corredores nas laterais
    camera = new THREE.PerspectiveCamera(78, window.innerWidth / window.innerHeight, 0.05, 50);
    camera.position.set(0, S.EYE_Y, S.EYE_Z);
    camera.lookAt(0, 1.05, -0.6);   // câmera inalterada

    // Construção
    buildRoom();
    buildCorridor('left');
    buildCorridor('right');
    buildCorridorFunctionalLights();
    buildDoor('left');
    buildDoor('right');
    buildWindowSmall('left');
    buildWindowSmall('right');
    buildDesk();
    buildMonitor();
    buildFan();
    buildDeskObjects();
    buildCeilingLamp();
    buildWallDecor();
    setupLighting();

    // Eventos
    document.getElementById('btn-start').onclick = startNight;
    document.getElementById('btn-left-door').addEventListener('pointerdown', function(e) { e.preventDefault(); toggleDoor('left'); });
    document.getElementById('btn-right-door').addEventListener('pointerdown', function(e) { e.preventDefault(); toggleDoor('right'); });
    document.getElementById('btn-left-light').addEventListener('pointerdown', function(e) { e.preventDefault(); toggleLight('left'); });
    document.getElementById('btn-right-light').addEventListener('pointerdown', function(e) { e.preventDefault(); toggleLight('right'); });
    document.getElementById('btn-monitor').addEventListener('pointerdown', function(e) { e.preventDefault(); toggleMonitor(); });

    document.addEventListener('keydown', function(e) {
      if (!Game.running) return;
      if (e.code === 'KeyA') toggleDoor('left');
      if (e.code === 'KeyD') toggleDoor('right');
      if (e.code === 'KeyQ') toggleLight('left');
      if (e.code === 'KeyE') toggleLight('right');
      if (e.code === 'Space') { e.preventDefault(); toggleMonitor(); }
    });

    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('vignette').classList.remove('hidden');
  } catch (err) {
    showError(err.message || String(err));
  }
}

/* ================================================================
   CONTROLES
   ================================================================ */
function toggleDoor(side) {
  if (!Game.running) return;
  Game.doors[side] = !Game.doors[side];
  Game.doorTarget[side] = Game.doors[side] ? 1 : 0;
  updateHUD();
}
function toggleLight(side) {
  if (!Game.running) return;
  Game.lights[side] = !Game.lights[side];
  updateHUD();
}
function toggleMonitor() {
  if (!Game.running) return;
  Game.monitorOpen = !Game.monitorOpen;
  updateHUD();
}

/* ================================================================
   HUD
   ================================================================ */
var _hudCache = {};
function setHTML(id, html) {
  if (_hudCache[id] !== html) { _hudCache[id] = html; document.getElementById(id).innerHTML = html; }
}
function updateHUD() {
  document.getElementById('power-display').textContent = Math.floor(Game.power) + '%';
  document.getElementById('power-bar').style.width = Game.power + '%';

  var h12 = (Game.hour === 0 ? 12 : Game.hour);
  var mm = String(Math.floor(Game.hourProgress * 60));
  if (mm.length < 2) mm = '0' + mm;
  document.getElementById('time-display').textContent = h12 + ':' + mm + ' AM';

  document.getElementById('sys-cam').textContent = '0.1';
  document.getElementById('sys-doors').textContent =
    ((Game.doors.left ? 1.2 : 0) + (Game.doors.right ? 1.2 : 0)).toFixed(1);
  document.getElementById('sys-lights').textContent =
    ((Game.lights.left ? 0.8 : 0) + (Game.lights.right ? 0.8 : 0)).toFixed(1);

  var bars = Math.min(4, Game.usage);
  var html = '';
  for (var i = 0; i < 4; i++) html += '<span class="' + (i < bars ? 'on' : 'off') + '">▮</span>';
  setHTML('usage-display', html);

  setHTML('btn-left-door',
    'PORTA ESQ.<small>' + (Game.doors.left ? 'FECHADA' : 'ABERTA') + '</small>');
  setHTML('btn-right-door',
    'PORTA DIR.<small>' + (Game.doors.right ? 'FECHADA' : 'ABERTA') + '</small>');
  setHTML('btn-left-light',
    'LUZ ESQ.<small>' + (Game.lights.left ? 'LIGADA' : 'DESLIGADA') + '</small>');
  setHTML('btn-right-light',
    'LUZ DIR.<small>' + (Game.lights.right ? 'LIGADA' : 'DESLIGADA') + '</small>');
  setHTML('btn-monitor',
    'MONITOR DE CÂMERAS<small>' + (Game.monitorOpen ? 'ATIVO' : 'ESPAÇO') + '</small>');

  document.getElementById('btn-left-door').classList.toggle('active', Game.doors.left);
  document.getElementById('btn-right-door').classList.toggle('active', Game.doors.right);
  document.getElementById('btn-left-light').classList.toggle('active', Game.lights.left);
  document.getElementById('btn-right-light').classList.toggle('active', Game.lights.right);
  document.getElementById('btn-monitor').classList.toggle('active', Game.monitorOpen);
}

/* ================================================================
   START
   ================================================================ */
function startNight() {
  Game.running = true;
  Game.lastFrame = performance.now();
  Game.hour = 0; Game.hourProgress = 0;
  Game.power = 100; Game.usage = 1;
  Game.flickerNext = 3;
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('controls').classList.remove('hidden');
  updateHUD();
  requestAnimationFrame(loop);
}

/* ================================================================
   UPDATE
   ================================================================ */
function update(dt) {
  Game.ambientTime += dt;

  Game.hourProgress += dt / Game.HOUR_DURATION;
  if (Game.hourProgress >= 1) {
    Game.hourProgress = 0;
    Game.hour++;
    if (Game.hour >= 6) Game.hour = 0;
  }

  var usage = 1;
  if (Game.doors.left) usage += 1.2;
  if (Game.doors.right) usage += 1.2;
  if (Game.lights.left) usage += 0.8;
  if (Game.lights.right) usage += 0.8;
  if (Game.monitorOpen) usage += 0.3;
  Game.usage = Math.min(4, usage);
  var drain = (100 / (Game.HOUR_DURATION * 6)) * usage * 0.5;
  Game.power = Math.max(0, Game.power - drain * dt);

  // Animar portas
  var doorH = S.DOOR_H;
  ['left', 'right'].forEach(function(side) {
    var group = objs['door_' + side];
    if (!group) return;
    var target = Game.doorTarget[side];
    var cur = Game.doorAnim[side];
    var rate = 7;
    if (cur < target) cur = Math.min(target, cur + rate * dt);
    else if (cur > target) cur = Math.max(target, cur - rate * dt);
    Game.doorAnim[side] = cur;
    group.position.y = doorH * (2 - cur);
  });

  // Luzes funcionais dos corredores
  var targetL = Game.lights.left ? 1.4 : 0;
  var targetR = Game.lights.right ? 1.4 : 0;
  if (objs.corrLightLeft) objs.corrLightLeft.intensity += (targetL - objs.corrLightLeft.intensity) * dt * 20;
  if (objs.corrLightRight) objs.corrLightRight.intensity += (targetR - objs.corrLightRight.intensity) * dt * 20;
  if (objs.corrBackLightLeft) objs.corrBackLightLeft.intensity += ((Game.lights.left ? 0.7 : 0) - objs.corrBackLightLeft.intensity) * dt * 20;
  if (objs.corrBackLightRight) objs.corrBackLightRight.intensity += ((Game.lights.right ? 0.7 : 0) - objs.corrBackLightRight.intensity) * dt * 20;

  // Bulbos do corredor
  ['left', 'right'].forEach(function(side) {
    var on = Game.lights[side];
    var bulbs = objs['corr_bulbs_' + side] || [];
    for (var i = 0; i < bulbs.length; i++) {
      bulbs[i].material.emissiveIntensity = on ? 2.0 : 0.5;
    }
  });

  // LEDs e halos das portas
  ['left', 'right'].forEach(function(side) {
    var led = objs['door_led_' + side];
    var halo = objs['door_halo_' + side];
    var dLight = objs['door_light_' + side];
    if (Game.doors[side]) {
      var pulse = 0.7 + Math.sin(Game.ambientTime * 4) * 0.3;
      if (led) led.material = makeMat(0x000000, 0.3, 0.2, { emissive: 0xff1a00, emissiveIntensity: 2.5 * pulse });
      if (halo) halo.intensity = 0.9 * pulse;
      if (dLight) dLight.intensity += (0.7 - dLight.intensity) * dt * 4;
    } else {
      if (led) led.material = MAT.ledRed;
      if (halo) halo.intensity = 0.4;
      if (dLight) dLight.intensity += (0 - dLight.intensity) * dt * 4;
    }
  });

  // Flicker da lâmpada
  Game.flickerNext -= dt;
  if (Game.flickerNext <= 0 && !Game.flickerActive) {
    if (Math.random() < 0.3) {
      Game.flickerActive = 'surge';
      Game.flickerTime = 0.15 + Math.random() * 0.25;
      Game.flickerPeak = 1.3 + Math.random() * 0.4;
    } else {
      Game.flickerActive = 'flicker';
      Game.flickerTime = 0.1 + Math.random() * 0.15;
    }
  }
  if (Game.flickerActive) {
    Game.flickerTime -= dt;
    if (Game.flickerActive === 'flicker') {
      Game.flickerBoost = Math.random() > 0.5 ? -0.35 : 0.15;
    } else {
      var r = Math.max(0, Math.min(1, 1 - Game.flickerTime / 0.4));
      var curve = r < 0.3 ? r / 0.3 : (r < 0.6 ? 1 : 1 - (r - 0.6) / 0.4);
      Game.flickerBoost = Game.flickerPeak * curve;
    }
    if (Game.flickerTime <= 0) {
      Game.flickerActive = null;
      Game.flickerBoost = 0;
      Game.flickerNext = 3 + Math.random() * 6;
    }
  }

  if (objs.lampLight && objs.lampGlobe) {
    var base = 1.1;
    var ff = 1 + (Game.flickerBoost || 0);
    objs.lampLight.intensity = Math.max(0.3, base * ff);
    objs.lampGlobe.material.emissiveIntensity = Math.max(0.6, 2.2 * ff);
  }

  // Ventilador
  if (fanBlades) fanBlades.rotation.z += dt * 1.1;   // rotação lenta e sutil

  // LEDs rádio
  if (objs.radioLeds) {
    var toggle = Math.floor(Game.ambientTime * 3) % 2;
    for (var rl = 0; rl < objs.radioLeds.length; rl++) {
      objs.radioLeds[rl].material = (rl === toggle) ? MAT.ledRed : MAT.plasticBlack;
    }
  }

  // LED câmera
  if (objs.secCamLed) {
    var on2 = Math.sin(Game.ambientTime * 2) > 0;
    objs.secCamLed.material = on2 ? MAT.ledRed : MAT.plasticBlack;
  }

  // Monitor screen
  var nowSec = Math.floor(Game.ambientTime * 2);
  if (nowSec !== objs.lastMonitorDraw) {
    objs.lastMonitorDraw = nowSec;
    drawMonitorScreen();
  }

  if (objs.monLight) {
    var target = Game.monitorOpen ? 0.75 : 0.55;
    objs.monLight.intensity += (target - objs.monLight.intensity) * dt * 4;
  }

  updateHUD();
}

/* ================================================================
   LOOP
   ================================================================ */
function loop(now) {
  if (!Game.running) return;
  var dt = Math.min(0.1, (now - Game.lastFrame) / 1000);
  Game.lastFrame = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

}
</script>
